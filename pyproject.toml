[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wto-policy-support"
version = "0.1.0"
description = "中国制造业出口企业决策支持:HS编码 × 海关税则 × 政策态度"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "jiaya" },
]
keywords = ["wto", "tariff", "hs-code", "trade", "policy", "e-commerce", "cross-border"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.32",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "vcrpy>=5.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "freezegun>=1.4",
    "respx>=0.21",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
wto-lookup-hs = "wto_policy.cli.lookup_hs:main"
wto-update = "wto_policy.update:main"
wto-api = "wto_policy.api.main:run"
wto-web = "wto_policy.web.app:main"

[project.urls]
Homepage = "https://github.com/jiayangrui05160031-cmyk/wto-policy-support"
Issues = "https://github.com/jiayangrui05160031-cmyk/wto-policy-support/issues"
Source = "https://github.com/jiayangrui05160031-cmyk/wto-policy-support"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wto_policy = ["py.typed", "data/seed/*.yaml"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # 已在 line-length 控制
    "B008",  # FastAPI Depends() 常见用法
    "RUF002",  # 中文 docstring 用 × 是正常用法
    "RUF003",  # 同上
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False 允许

# ---- Pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
    "vcr: marks tests that use VCR.py fixtures",
]

# ---- MyPy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["streamlit.*", "jupyter.*"]
ignore_missing_imports = true
