# Section 301 / Section 232 / IEEPA / MFN 关税种子数据
#
# 数据来源 (更新 2026-07-08):
# - USTR Section 301 公告: https://ustr.gov/issue-areas/enforcement/section-301-investigations
# - HTSUS (USITC): https://hts.usitc.gov/
# - Federal Register: https://www.federalregister.gov/
# - 整理时间: 2026-07-08
#
# 每条措施:
# - hs_code: HS 编码(6-10 位, * 是通配, 例如 "8518*" 匹配 8518 全部)
# - measure_type: MFN / SECTION_301 / SECTION_232 / IEEPA
# - ad_valorem_rate: 从价税率 (0.25 = 25%)
# - legal_basis: 法规依据
# - source_url: 原始 URL
# - crawled_at: 抓取时间戳
# - effective_from: 生效日
# - effective_to: 失效日(可选)
#
# 注意:
# - 这是种子数据, 真实业务请用 wto-update 拉取 USTR / Federal Register 官方公告
# - List 4B (7.5%) 目前在法律挑战中, 状态可能变化
# - Section 232 钢铝 2026 年 4-6 月有重大调整, 实际申报前请核实

version: "2026-07-08"
note: "种子数据, 用于 MVP 离线决策. 真实场景请用 wto-update."

